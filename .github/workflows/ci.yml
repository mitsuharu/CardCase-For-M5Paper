name: PlatformIO CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  # CI では native (PC) を対象としたテストを行う。
  # Arduino.h や M5Unified.h などが必要なテストは実機環境が必要なので、CI ではテストしない（できない）。
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Run PlatformIO native test
      run: pio test -e native

  # 対応する機種ごとにファームウェアをビルドする。
  # 機種を追加したら environment に追記すること。
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - M5Paper
          - M5PaperS3
          - M5PaperColor
          - M5PaperMono

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Run PlatformIO build
      run: pio run -e ${{ matrix.environment }}

    - name: Upload bin-file as artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: firmware-${{ matrix.environment }}
        path: .pio/build/${{ matrix.environment }}/**/*.bin
        if-no-files-found: error

  # 全機種のビルドが揃ってから 1 件だけコメントする
  comment:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
    - name: Create or Update PR Comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          :rocket: 全機種のビルドが成功しました

          M5Paper / M5PaperS3 / M5PaperColor / M5PaperMono

          [こちらからダウンロードできます](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
