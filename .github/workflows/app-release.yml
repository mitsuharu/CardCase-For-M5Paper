name: App Release

# スマホのアプリを焼いて DeployGate に上げる。
# タグを打つか、Actions の画面から手動で実行する。
# タグ名は app- を付けたバージョン（例: app-1.2.3）。
# ファームウェアのリリース（1.2.3）とは別に動かすため、接頭辞で分けている。
on:
  push:
    tags:
      - 'app-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      platform:
        description: '焼く対象'
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      version:
        description: 'GitHub Release を作るバージョン（例: 1.2.3）。空なら Release は作らない'
        required: false
        type: string
      message:
        description: 'DeployGate に添えるメモ'
        required: false
        type: string

# APK を Release に添付する
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # 前回のアプリのリリースを探すのにタグの履歴が要る
        fetch-depth: 0

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      run: npm ci

    # 実際のビルドは EAS のサーバーで走る。ここは投げて待つだけ。
    # 証明書と署名鍵は EAS が預かっているので、この場には鍵を置かない。
    # --wait で終わるまで待ち、--json で結果を受け取る。
    - name: Build on EAS
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        PLATFORM="${{ inputs.platform || 'all' }}"
        npx eas-cli@23.2.0 build \
          --profile release \
          --platform "$PLATFORM" \
          --non-interactive \
          --wait \
          --json > builds.json
        jq -r '.[] | "\(.platform) \(.artifacts.buildUrl // .artifacts.applicationArchiveUrl)"' builds.json

    # 成果物を落とす。DeployGate と GitHub Release の両方から使う。
    - name: Download artifacts
      run: |
        mkdir -p dist
        jq -r '.[] | "\(.platform)\t\(.artifacts.buildUrl // .artifacts.applicationArchiveUrl)"' builds.json \
        | while IFS=$'\t' read -r platform url; do
            case "$platform" in
              IOS) file=CardCase.ipa ;;
              ANDROID) file=CardCase.apk ;;
              *) echo "知らない対象: $platform" >&2; exit 1 ;;
            esac
            echo "==> $platform を落とす"
            curl -sSL --fail-with-body -o "dist/$file" "$url"
          done
        ls -la dist

    # EAS の配布ページでも配れるが、iOS と Android を 1 か所にまとめたいので通す。
    - name: Upload to DeployGate
      env:
        DEPLOYGATE_USER: ${{ secrets.DEPLOYGATE_USER }}
        DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
      run: |
        MESSAGE="${{ inputs.message }}"
        if [ -z "$MESSAGE" ]; then
          MESSAGE="${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
        fi

        for file in dist/*; do
          echo "==> $file を上げる"
          response=$(curl -sS --fail-with-body \
            -F "file=@$file" \
            -F "token=$DEPLOYGATE_API_TOKEN" \
            -F "message=$MESSAGE" \
            "https://deploygate.com/api/users/$DEPLOYGATE_USER/apps")

          if echo "$response" | jq -e '.error == true' > /dev/null; then
            echo "失敗した: $(echo "$response" | jq -r '.message')" >&2
            exit 1
          fi
        done

    # APK だけを公開する。誰でも入れられるので Release に置く意味がある。
    #
    # ipa は載せない。Ad Hoc は登録済みの端末にしか入らないので誰も使えず、
    # プロファイルに端末の UDID が焼き込まれている。
    - name: Publish APK to GitHub Release
      if: startsWith(github.ref, 'refs/tags/app-') || inputs.version != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 手動実行のときはタグが無いので、入力から組み立てて gh に作らせる。
        if [ -n "${{ inputs.version }}" ]; then
          TAG="app-${{ inputs.version }}"
        else
          TAG="$GITHUB_REF_NAME"
        fi
        VERSION="${TAG#app-}"

        cat > notes.md <<'EOF'
        M5Paper に NFC で画像を送るアプリです。

        ## Android

        `CardCase.apk` を端末に落として開いてください。
        提供元不明のアプリの許可を求められるので、許可すると入ります。

        ## iOS

        端末の UDID 登録が要るため、ここには置いていません。
        入れたい端末があれば連絡してください。

        ## 使い方

        アプリで画像を選び、本体で `[NFC]` を選んでからかざしてください。
        本体側が `[NFC]` を表示している間だけ受け取ります。

        EOF

        # --generate-notes は前回のリリース以降の PR を並べる。
        # ファームウェアのリリースと同じリポジトリなので、起点を指定しないと
        # 直前のファームウェアのリリースからの差分になってしまう。
        PREV=$(git tag -l 'app-*' --sort=-v:refname | grep -v "^${TAG}\$" | head -1)
        START=""
        if [ -n "$PREV" ]; then
          START="--notes-start-tag $PREV"
        fi

        gh release create "$TAG" \
          --title "App $VERSION" \
          --notes-file notes.md \
          --generate-notes \
          $START \
          --target "${{ github.sha }}" \
          dist/CardCase.apk
