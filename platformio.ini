; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = M5PaperS3

; 実機向け env の共通設定。
; 機種ごとの env は board と CARDCASE_FALLBACK_BOARD の差分だけを持つ。
[device]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
lib_deps =
	m5stack/M5Unified@0.2.21
	m5stack/M5GFX@0.2.28

; M5Paper v1.1 (ESP32)
; https://docs.m5stack.com/ja/core/m5paper_v1.1
[env:M5Paper]
extends = device
board = m5stack-fire
build_flags =
	${device.build_flags}
	-DCARDCASE_FALLBACK_BOARD=board_M5Paper

; M5PaperS3 (ESP32-S3)
; https://docs.m5stack.com/ja/core/PaperS3
[env:M5PaperS3]
extends = device
board = esp32-s3-devkitm-1
board_build.arduino.memory_type = qio_opi
build_flags =
	${device.build_flags}
	-DCARDCASE_FALLBACK_BOARD=board_M5PaperS3

; M5PaperColor (ESP32-S3)
; https://docs.m5stack.com/ja/core/PaperColor
; M5GFX は OPI-PSRAM が無効だとディスプレイを初期化しないので memory_type は必須。
[env:M5PaperColor]
extends = device
board = esp32s3box
board_build.arduino.memory_type = qio_opi
build_flags =
	${device.build_flags}
	-DCARDCASE_FALLBACK_BOARD=board_M5PaperColor

; M5PaperMono (ESP32-S3)
; https://docs.m5stack.com/ja/core/PaperMono
; NFC を積むのはこの機種だけなので、関連のライブラリもここにだけ足す
[env:M5PaperMono]
extends = device
board = esp32-s3-devkitm-1
board_build.arduino.memory_type = qio_opi
build_flags =
	${device.build_flags}
	-DCARDCASE_FALLBACK_BOARD=board_M5PaperMono
	-DCARDCASE_HAS_NFC=1
	-std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
	${device.lib_deps}
	m5stack/M5UnitUnified@0.5.0
	https://github.com/m5stack/M5Unit-NFC.git#0.1.0
; ライブラリの受信バッファが 64 バイト固定で、こちらのフレームが入らないため広げる
extra_scripts = pre:scripts/patch_m5unit_nfc.py

; テスト用の環境
; この環境では Arduino.h や M5 系は使えませんが、純粋な関数ロジックのテストには最適です。
[env:native]
platform = native
build_flags = -std=c++17
